publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.0

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  shared_preferences: ^2.5.5
  percent_indicator: ^4.2.5
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
